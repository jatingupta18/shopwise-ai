<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ShopWise AI Order History">
    <title>ShopWise AI | Order History</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="order-history-page">
<div class="page-glow glow-one"></div><div class="page-glow glow-two"></div>
<main class="app-shell">
    <section class="order-history-card" aria-labelledby="history-title">
        <header class="app-header">
            <a class="brand" href="/chat.html" aria-label="ShopWise AI chat">
                <span class="brand-symbol" aria-hidden="true"><b>S</b><i></i><i></i></span>
                <span><small>CATALOG-GROUNDED ASSISTANT</small><strong>ShopWise <em>AI</em></strong></span>
            </a>
            <div class="header-actions">
                <a class="home-link" href="/">Home</a>
                <button id="cartButton" class="cart-button" type="button" aria-label="Open shopping cart">
                    <span class="cart-icon">🛒</span>
                    <span id="cartBadge" class="cart-badge">0</span>
                </button>
                <div class="header-status" title="Recommendations are checked against your current catalog"><span class="online-dot"></span><span class="status-copy"><b>Live catalog</b><small>Connected</small></span></div>
            </div>
        </header>

        <div class="order-history-content">
            <h1 id="history-title">Order History</h1>
            <p class="history-subtitle">View your past orders and their status</p>

            <div id="ordersContainer" class="orders-container">
                <!-- Orders will be rendered here -->
            </div>

            <div id="emptyState" class="empty-orders-state" style="display: none;">
                <div class="empty-icon">📦</div>
                <p>No orders yet</p>
                <small>Start shopping to create your first order</small>
                <a href="/chat.html" class="start-shopping-button">Start Shopping</a>
            </div>

            <div id="loadingState" class="loading-state" style="display: none;">
                <div class="loading-spinner"></div>
                <p>Loading your orders...</p>
            </div>

            <div id="errorState" class="error-state" style="display: none;">
                <div class="error-icon">⚠️</div>
                <p>Unable to load orders</p>
                <small>Please try again later</small>
                <button onclick="loadOrders()" class="retry-button">Retry</button>
            </div>
        </div>
    </section>
</main>

<!-- Cart Drawer -->
<div id="cartOverlay" class="cart-overlay"></div>
<aside id="cartDrawer" class="cart-drawer" aria-label="Shopping cart">
    <div class="cart-header">
        <h2>Your Cart</h2>
        <button id="closeCartButton" class="close-cart-button" type="button" aria-label="Close cart">
            <span>×</span>
        </button>
    </div>
    <div id="cartItems" class="cart-items">
        <!-- Cart items will be rendered here -->
    </div>
    <div class="cart-footer">
        <div class="cart-summary">
            <div class="cart-summary-row">
                <span id="cartItemCount">0 items</span>
                <span id="cartSubtotal">₹0.00</span>
            </div>
        </div>
        <div class="cart-actions">
            <button id="clearCartButton" class="clear-cart-button" type="button">Clear Cart</button>
            <button id="checkoutButton" class="checkout-button" type="button">Proceed to Checkout</button>
        </div>
    </div>
</aside>

<script src="/app.js"></script>
<script src="/order-history.js"></script>
</body>
</html>
