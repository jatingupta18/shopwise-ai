spring.application.name=ai-shopping-agent
# Use H2 for development by default (same as tests). MySQL is opt-in via environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:mem:shopping;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Local Ollama is the default, free development provider. See README for setup.
app.ai.provider=${AI_PROVIDER:ollama}
app.ai.fallback-enabled=${AI_FALLBACK_ENABLED:true}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2}
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.model.chat=ollama

# OpenAI is opt-in through the `openai` Spring profile; never commit a key.
